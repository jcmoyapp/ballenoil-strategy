name: Captura de Precios

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos
  workflow_dispatch:  # permite lanzarlo manualmente desde GitHub

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Capturar precios del Ministerio
        run: python3 .github/scripts/capture_prices.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historico_precios.json data/estaciones_snapshot.json data/estaciones_eventos.json
          git diff --staged --quiet || git commit -m "snapshot: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
